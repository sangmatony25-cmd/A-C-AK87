name: Pure Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ১. প্রজেক্টের ভেতরের gradlew ফাইলটি স্বয়ংক্রিয়ভাবে খুঁজে বের করে পারমিশন দেওয়া
      - name: Find and Grant Execute Permission for Gradlew
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere in the repository!"
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      # ২. সঠিক ফোল্ডারের ভেতরে ঢুকে এপিকে বিল্ড করা
      - name: Build Debug APK
        run: |
          cd ${{ env.GRADLEW_DIR }}
          ./gradlew assembleDebug

      # ৩. প্রজেক্টের যেকোনো ফোল্ডার থেকে তৈরি হওয়া APK খুঁজে আপলোড করা
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
